name: iOS Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: false
        working-directory: ios

    - name: Bundle install
      run: |
        cd ios
        export LANG=en_US.UTF-8
        export LC_ALL=en_US.UTF-8
        bundle install

    - name: Install Pods
      run: |
        cd ios
        export LANG=en_US.UTF-8
        export LC_ALL=en_US.UTF-8
        bundle exec pod install --repo-update

    - name: Build iOS app
      run: |
        cd ios
        xcodebuild \
          -workspace read_en.xcworkspace \
          -scheme read_en \
          -configuration Release \
          -derivedDataPath build \
          -arch arm64 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Archive build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/build

  build-with-signing:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        working-directory: ios

    - name: Import signing certificate
      env:
        SIGNING_CERTIFICATE_P12_DATA: ${{ secrets.SIGNING_CERTIFICATE_P12_DATA }}
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        # Decode certificate
        echo $SIGNING_CERTIFICATE_P12_DATA | base64 --decode > certificate.p12

        # Import to keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security import certificate.p12 \
          -k build.keychain \
          -P "$SIGNING_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

    - name: Import provisioning profile
      env:
        PROVISIONING_PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_DATA }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo $PROVISIONING_PROFILE_DATA | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - name: Install Pods
      run: |
        cd ios
        export LANG=en_US.UTF-8
        export LC_ALL=en_US.UTF-8
        bundle exec pod install --repo-update

    - name: Build and sign iOS app
      run: |
        cd ios
        xcodebuild \
          -workspace read_en.xcworkspace \
          -scheme read_en \
          -configuration Release \
          -derivedDataPath build \
          -arch arm64 \
          -allowProvisioningUpdates \
          CODE_SIGN_IDENTITY="iPhone Distribution"

    - name: Archive app
      run: |
        cd ios
        xcodebuild \
          -workspace read_en.xcworkspace \
          -scheme read_en \
          -configuration Release \
          -archivePath build/read_en.xcarchive \
          archive

    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive \
          -archivePath build/read_en.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build/ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/build/ipa/*.ipa
